name: Deploy to Fly (premise-ops.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy instead of cancelling it mid-rollout.
concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit & Integration Tests
        run: bun test

  deploy:
    name: Deploy premise-ops to Fly
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify premise-ops.com
        run: |
          for path in / /demo; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 --retry-all-errors "https://premise-ops.com${path}")
            echo "https://premise-ops.com${path} -> ${code}"
            test "$code" = "200"
          done
