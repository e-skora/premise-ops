name: PremiseOps Architectural & Strategic Decision CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Continuously evaluate load-bearing architectural & FinOps premises every hour
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  premise-assertions:
    name: Evaluate Load-Bearing Premises & Cascade Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Unit & Integration Tests
        run: bun test

      - name: Scan Codebase for Inline @premise Annotations
        run: bun ./bin/premise-cli.ts scan

      - name: Run Historical Telemetry Time-Machine Backtest
        run: bun ./bin/premise-cli.ts backtest --scenario historical

      # No live internet here: the OpenRouter premise reads a saved copy of the
      # real response (examples/fixtures/live-feeds). At that saved price
      # ($2.00 per 1M tokens) ADR-014's "> $2.00" premise is really BROKEN, so
      # the step expects exactly that and fails on any other outcome.
      # The live site keeps fetching the real price.
      - name: Run PremiseOps CI/CD Decision Assertions
        env:
          PREMISE_FEED_FIXTURE_DIR: examples/fixtures/live-feeds
        run: bun ./bin/premise-cli.ts check --expect-broken upstream_llm_input_cost_usd

  # The README's "use it in your own repo" steps, run against a stand-in repo
  # (examples/user-repo). Its database starts empty (no demo decisions), its
  # @premise probe really runs against the saved OpenRouter copy, and the
  # premise holds at that price, so check must exit 0.
  user-repo-check:
    name: Check a Stand-In User Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile || bun install

      - name: Import @premise comments and check them
        env:
          PREMISE_WORKSPACE_ROOT: ${{ github.workspace }}/examples/user-repo
          PREMISE_DB_PATH: ${{ runner.temp }}/premise.db
          PREMISE_FEED_FIXTURE_DIR: ${{ github.workspace }}/examples/fixtures/live-feeds
        run: |
          bun ./bin/premise-cli.ts scan --import
          bun ./bin/premise-cli.ts check

